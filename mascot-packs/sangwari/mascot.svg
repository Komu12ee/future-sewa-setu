<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <linearGradient id="sangwariBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f"/>
      <stop offset="100%" stop-color="#feb47b"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Traditional Pagdi / Cap Accent -->
  <path d="M 85,85 Q 150,30 215,85 Q 230,65 190,45 Q 150,25 110,45 Z" fill="#e65100"/>
  <circle cx="150" cy="55" r="9" fill="#ffd700" filter="url(#goldGlow)"/>

  <!-- Head -->
  <circle cx="150" cy="130" r="65" fill="#ffe0b2" stroke="#e65100" stroke-width="3"/>

  <!-- Headset -->
  <path d="M 80,130 A 70,70 0 0,1 220,130" fill="none" stroke="#263238" stroke-width="6"/>
  <rect x="74" y="120" width="12" height="24" rx="6" fill="#0288d1"/>
  <rect x="214" y="120" width="12" height="24" rx="6" fill="#0288d1"/>
  <path d="M 80,135 Q 100,175 130,170" fill="none" stroke="#263238" stroke-width="3" stroke-linecap="round"/>
  <circle cx="130" cy="170" r="5" fill="#ff5722"/>

  <!-- Eyes -->
  <circle cx="125" cy="125" r="10" fill="#212121"/>
  <circle cx="175" cy="125" r="10" fill="#212121"/>
  <circle cx="122" cy="122" r="3" fill="#ffffff"/>
  <circle cx="172" cy="122" r="3" fill="#ffffff"/>

  <!-- Tilak -->
  <path d="M 148,95 L 152,95 L 150,110 Z" fill="#d32f2f"/>
  <circle cx="150" cy="112" r="2" fill="#ffd700"/>

  <!-- Smile -->
  <path d="M 135,145 Q 150,160 165,145" fill="none" stroke="#bf360c" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cheeks -->
  <circle cx="110" cy="140" r="7" fill="#ff8a80" opacity="0.6"/>
  <circle cx="190" cy="140" r="7" fill="#ff8a80" opacity="0.6"/>

  <!-- Body / Kurta -->
  <path d="M 105,195 L 195,195 L 225,280 L 75,280 Z" fill="url(#sangwariBody)" stroke="#e65100" stroke-width="2"/>
  <path d="M 150,195 L 150,280" stroke="#d84315" stroke-width="2"/>
  
  <!-- Nehru Jacket Style Collar -->
  <path d="M 120,195 Q 150,215 180,195" fill="none" stroke="#bf360c" stroke-width="3"/>

  <!-- Arms -->
  <path d="M 85,210 Q 55,235 65,265" fill="none" stroke="url(#sangwariBody)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 215,210 Q 245,235 235,265" fill="none" stroke="url(#sangwariBody)" stroke-width="14" stroke-linecap="round"/>
  <!-- Hands folded / namaste -->
  <ellipse cx="150" cy="235" rx="14" ry="10" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
</svg>
